name: SizeOK Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Run Maven verification & acceptance tests
        run: mvn -B test

      - name: Set up Python 3.11 for workers
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python worker syntax
        run: python -m py_compile python-workers/common/ssrf_guard.py python-workers/size_chart_parser/parser.py
