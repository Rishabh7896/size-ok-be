version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sizeok-postgres
    environment:
      POSTGRES_DB: sizeok
      POSTGRES_USER: sizeok
      POSTGRES_PASSWORD: sizeok_dev_password
    ports:
      - "5432:5432"
    volumes:
      - sizeok_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sizeok -d sizeok"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sizeok-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sizeok_pgdata:
